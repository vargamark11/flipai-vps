<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FlipAI</title>
  <meta name="description" content="FlipAI — fast self-hosted AI chat." />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="brand-row">
        <div class="brand-mark">F</div>
        <div>
          <div class="brand-name">FlipAI</div>
          <div class="brand-subtitle">Self-hosted AI</div>
        </div>
      </div>

      <button id="newChatBtn" class="primary-btn full">+ New chat</button>

      <div class="sidebar-section-title">Conversations</div>
      <div id="conversationList" class="conversation-list"></div>

      <div class="sidebar-footer">
        <div class="credits-card">
          <span>Credits</span>
          <strong id="creditsValue">—</strong>
        </div>
        <div id="userBox" class="user-box hidden">
          <div>
            <strong id="userName"></strong>
            <span id="userEmail"></span>
          </div>
          <button id="logoutBtn" class="ghost-btn">Log out</button>
        </div>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div>
          <h1 id="chatTitle">FlipAI</h1>
          <p id="statusText">Ready</p>
        </div>
      </header>

      <section id="authView" class="auth-view">
        <div class="auth-card">
          <div class="auth-tabs">
            <button id="loginTab" class="tab active">Log in</button>
            <button id="registerTab" class="tab">Register</button>
          </div>

          <form id="loginForm" class="auth-form">
            <label>Email<input id="loginEmail" type="email" autocomplete="email" required /></label>
            <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required /></label>
            <button class="primary-btn" type="submit">Log in</button>
          </form>

          <form id="registerForm" class="auth-form hidden">
            <label>Name<input id="registerName" type="text" autocomplete="name" required /></label>
            <label>Email<input id="registerEmail" type="email" autocomplete="email" required /></label>
            <label>Password<input id="registerPassword" type="password" autocomplete="new-password" minlength="8" required /></label>
            <button class="primary-btn" type="submit">Create account</button>
          </form>

          <p id="authError" class="error-text"></p>
        </div>
      </section>

      <section id="chatView" class="chat-view hidden">
        <div id="messages" class="messages"></div>
        <div class="composer-wrap">
          <form id="composerForm" class="composer">
            <textarea id="messageInput" rows="1" placeholder="Message FlipAI…" required></textarea>
            <button id="sendBtn" class="send-btn" type="submit">Send</button>
          </form>
          <div class="composer-hint">FlipAI may make mistakes. Check important information.</div>
        </div>
      </section>
    </main>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
